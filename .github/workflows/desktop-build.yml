# Builds Pomo Desktop for Windows and Linux on GitHub machines.
# Run it by hand from the Actions tab (or `gh workflow run desktop-build.yml`), then download
# the artifacts: the .appx goes to Partner Center; the .exe, .AppImage and .deb go to a
# release of TunarJamalov/pomo, which the website links to.
name: Desktop build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pomo-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pomo-desktop/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Package Store (.appx) and installer (.exe)
        run: npx electron-builder --win appx nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pomo-desktop-windows
          path: |
            pomo-desktop/release/*.appx
            pomo-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pomo-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pomo-desktop/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Package AppImage and .deb
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pomo-desktop-linux
          path: |
            pomo-desktop/release/*.AppImage
            pomo-desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
