[package]
name = "pomo-focus"
version = "2.0.0"
edition = "2024"
description = "Pomodoro focus timer that syncs your sessions to Pomo, the Discord study bot"
homepage = "https://pomofocus.online/desktop"
repository = "https://github.com/TunarJamalov/pomo"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# Software renderer: no GPU stack, so the app stays small in memory
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    # Rasterize our TTF fonts at any size (the timer digits scale with the window)
    "software-renderer-systemfonts",
    "system-tray",
    "image-default-formats",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
dirs = "6"
notify-rust = "4"
interprocess = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
rand = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Idle time on Wayland desktops (KDE) that do not answer the D-Bus idle methods
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# Development only: POMO_SNAPSHOT=<file.ppm> renders a view to an image instead of opening a window
snapshot = []
